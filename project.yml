name: MyPersonalGym
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_CFBundleDisplayName: "My Personal Gym"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.healthcare-fitness"
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_NSCameraUsageDescription: "Camera is used to analyze your exercise form in real-time"
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save workout videos to your photo library"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone is used for video recording"

targets:
  MyPersonalGym:
    type: application
    platform: iOS
    sources: [MyPersonalGym]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.mypersonalgym
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme: {}
